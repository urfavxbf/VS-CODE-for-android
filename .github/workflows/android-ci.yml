name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile, run JVM tests, lint, build APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Generate integrity checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CodespaceMobileNext-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 30
          if-no-files-found: error

  emulator-smoke:
    name: Emulator launch smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-results
          path: app/build/outputs/androidTest-results
          retention-days: 14

  publish-debug:
    name: Publish APK to GitHub Releases
    runs-on: ubuntu-latest
    needs: [check, emulator-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CodespaceMobileNext-debug
          path: release
      - name: Verify APK and publish latest debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          test -s app-debug.apk
          sha256sum --check app-debug.apk.sha256
          cd ..
          if gh release view android-debug-latest >/dev/null 2>&1; then
            gh release upload android-debug-latest \
              "release/app-debug.apk#VS-CODE-for-android-debug.apk" \
              "release/app-debug.apk.sha256" --clobber
          else
            gh release create android-debug-latest \
              "release/app-debug.apk#VS-CODE-for-android-debug.apk" \
              "release/app-debug.apk.sha256" \
              --target "$GITHUB_SHA" --prerelease \
              --title "VS Code for Android — Latest Debug APK" \
              --notes "Unofficial test APK for Android 8.0+. Built on main and published only after unit tests, Android lint, APK build, and emulator launch pass. Not a production-signed release. GitHub PAT is never included in the APK."
          fi
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/android-debug-latest/VS-CODE-for-android-debug.apk" >> "$GITHUB_STEP_SUMMARY"
